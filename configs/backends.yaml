# System-One backend configuration (design_v1 §11). `make_backend()` in src/jevtrader/s1/backends.py reads it.
# Programs send identical (state, questions) on every backend; switching to Jev is `s1.backend: jev` (§11.3).
# emu-v1 is frozen with the question bank on 2026-09-29 (SHA-256 of the bank; prompt texts live in the bank, §E).

s1:
  backend: llm-logprob          # llm-logprob (primary) | llm-verbalized | jev | typed-local | mock (offline only)

backends:
  llm-logprob:                  # backend id llm-logprob/emu-v1
    model: gpt-4.1-mini-2025-04-14   # pinned snapshot; every response.model is asserted equal (validity M3, F16)
    prompt_version: emu-v1
    max_concurrency: 64         # F11
    degraded_retries: 2         # degraded parse -> 2 retries -> probs=None, never cached (validity M13)
    assert_response_model: true
    prompt_cache:               # provider prompt caching, routing only: never in the request key or cfg_hash
      enabled: false            # (s1/prompt_cache.py; docs/impl/dev2_ops.md §1; dev1_report P1-1 / S-1)
                                # 2026-09-28, freeze: OFF by the pre-declared rule O-5 (dev2_ops A-6): DEV #2's pooled
                                # realization 0.339 < DEV #1's 0.3847 (results/dev2/prompt_cache_decision.json;
                                # dev2_report §3.2), so MAIN runs in DEV #1's regime (no prompt_cache_key). Provider
                                # caching of identical prefixes still applies; about $1.4 on MAIN either way
      rpm_per_key: 15           # docs/pricing/openai_guide_prompt-caching_2026-09-26.txt lines 743-763
      max_shards: 1             # one stable key per static-prefix family; > 1 partitions at rpm_per_key (the guide's
                                # advice), which measured worse on 09-28 (dev2_ops §1.4): keep 1 unless DEV #2 says otherwise
      warm: true                # the first request of a key goes alone, then the key fans out
  llm-verbalized:               # backend id llm-verbalized/verb-v1 (X5 sample only)
    model: gpt-4.1-mini-2025-04-14
    prompt_version: verb-v1
    max_concurrency: 64
    degraded_retries: 2
    assert_response_model: true
    prompt_cache: {enabled: false, rpm_per_key: 15, max_shards: 1, warm: true}   # 2026-09-28 P-6: routing off, as emu (O-5)
  jev:
    model: jev-1.13.0           # versioned id, never the jev-latest alias (docs/jev/pages/models)
    max_concurrency: 64
    rpm: 1000                   # under the documented 1,200 rpm, which "can change without notice"
    request_timeout: 30.0
    retry: {max_retries: 8, backoff_max: 60.0, timeout: 600.0}   # §11.3; timeout = total retry budget per call
    assert_response_model: true
  jev-cf:                       # Cloudflare-hosted Jev (Workers AI model typesafe/jev): s1/cloudflare_jev.py,
                                # docs/impl/jev_cloudflare.md. Needs CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_API_TOKEN in .env
                                # and a positive ledger.sub_caps_usd.JEV-CF (0 = not authorized)
    model: jev-1.13.0           # the versioned id the archived examples report; asserted on every response.model
    cf_model: typesafe/jev      # Workers AI model name in the request body (docs/jev/cloudflare_jev.md)
    max_concurrency: 16
    rpm: 240                    # 80% of the Text Generation default of 300 rpm (docs/jev/cloudflare_platform_limits.md)
    request_timeout: 60.0
    retry: {max_retries: 8, backoff_max: 60.0, timeout: 600.0}   # as jev (§11.3); timeout = total retry budget per call
    context_tokens: 32000       # "Context Window 32,000 tokens"; a larger estimated input abstains unsent
    degraded_retries: 2
    assert_response_model: true
    ledger_path: data/cache/spend_jev_cf.sqlite   # Jev spend is outside the $250 LLM budget (CLAUDE.md; D-13): its own
                                # ledger file, hard cap = the JEV-CF sub-cap below
  mock:
    model: mock-1
    max_concurrency: 64
  typed-local:                  # backend id typed-local/ng-v1: the open typed decision model (design_v2_delta IF-1, D-1)
    model: flock-io/this-that-model-1.0@3d927195c4f9845efe66c5715883a7a0f42b1239   # HF repo@revision, asserted
    python: .venv-ng/bin/python # isolated env: CPU torch 2.14.0, transformers 5.17.0, thisthat 1.0.0 @ 542d445
    package_commit: 542d445efa5f68b14bfbd1f8ed25aacd8379d839   # github.com/FLock-io/this-that-model (source archive)
    threads: 6                  # NG-0 tuning: 6 of 12 cores (12 threads oversubscribe the shared machine)
    dtype: float32              # the package's CPU default (bf16 matmul on CPU is slow)
    max_state_tokens: 32768     # never truncate a state (the package default is 1,536 tokens)
    max_concurrency: 1          # one worker; requests are serialized
    degraded_retries: 0         # no retries: an answer outside the options is unrepresentable
    request_timeout: 600.0      # seconds; a timeout abstains and restarts the worker
    startup_timeout: 900.0
    assert_response_model: true

cache:
  path: data/cache/s1_v1.sqlite  # v1 keys; the v0 caches (s1_pilot/s1_design/s1_smoke) are kept as they are

ledger:
  path: data/cache/spend.sqlite
  hard_cap_usd: 245             # USER BUDGET $250 TOTAL (2026-09-28, user instruction; was $1,000/950). $5 margin for in-flight batches
  batch_size: 32                # batched commits (F10)
  # Per-run sub-caps = 1.5 x planned USD (results/plan/plan_v1.json cost_rows_usd). A ledger tag "<RUN>/<program>"
  # counts against <RUN>. Tags without an entry are covered by the hard cap only (logged once per run).
  # 2026-09-28 (docs/impl/dev2_ops.md §2): runs whose re-projection from DEV #1's measured tokens and caching
  # (results/plan/plan_v3.json, base case) exceeds 1/1.5 of the old cap get 1.5 x the v3 projection; no cap was lowered.
  # 2026-09-28, DEV #2 audit response (docs/impl/dev2_n1.md §9): plan_v3 priced N1 as rc5's one request per item; the
  # runs that send N1 are re-projected with N1 priced from the live bank's N1.requests plan (v1.0-rc7) by
  # experiments/dev/n1_fix/cost_plan.py (out/cost_plan.json, plans.live, base case) and get 1.5 x that projection.
  # 2026-09-28 RE-PLAN (user: total LLM budget $250): sub-caps below were rewritten; a sub-cap of 0 disables that run.
  sub_caps_usd:
    SMOKE: 0.30                 # implementation smoke tests
    DEV0: 0.00                  # Day-2 workstream smoke tests (tags DEV0/<ws>/...), <= $0.50 per workstream
    DEV: 0.00                   # 6.1 (the design's two DEV runs; the runs are tagged DEV1 and DEV2 below)
    DEV1: 0.00                  # DEV #1 (09-28, dev1_report): set at run time by its driver, recorded here; spent 5.56
    DEV2: 0.00                  # DEV #2 (09-29): 1.5 x the design's DEV plan, as DEV1
    DEV2OPS: 0.00               # DEV #2 ops stream: 50-request prompt-cache measurement (docs/impl/dev2_ops.md)
    PRE: 31.50                 # 81.02 (cost_plan live base, uncached 91.4; was 89.05 = 1.5 x plan_v3 59.34)
    MAIN: 132.00                # 137.86 (cost_plan live base, uncached 155.5; was 151.85 = 1.5 x plan_v3 101.21)
    H: 1.50                    # 8.9
    HS: 0.00                    # 4.6
    NODEF: 3.00                # 36.37 (cost_plan live base, no guard request; was 46.10 = 1.5 x plan_v3 30.71)
    TAL: 12.00                  # 52.6
    RT-S: 12.00                 # 38.59 (cost_plan live base: the v1 rows + RB-1..3, RB-11 + H-spot/H-guard attacked
                                # units, all tagged RT-S/<arm> by redteam/run.py; was 52.50 = 1.5 x plan_v3 34.97)
    RT-A: 0.00                 # 20.14 (cost_plan live base; was 25.35 = 1.5 x plan 16.9)
    FAITH: 3.00                # 8.0
    FID: 2.50                   # 5.0
    PROBE: 1.50                 # 3.0
    MEM: 2.50                  # 10.90 (plan_v3 base; was 13.80 = 1.5 x 9.2)
    LIVE: 6.50                 # 8.0
    S2: 0.00                   # 22.7
    VERB: 4.00                 # 12.25 (cost_plan live base; was 15.90 = 1.5 x plan 10.6)
    MCOT: 4.50                 # 8.8
    XWEB: 0.00                  # 5.2
    # design_v2_delta RP-6 / §6: new run tags, 1.5 x their planned USD (typed-local/NG has no ledger entry)
    HSPOT: 2.00                # 16 (RB-5)
    HGUARD: 2.00               # 12 (RB-15)
    VERB-C1I: 0.00              # 3.5 (IF-2)
    MCOT-RT: 0.00               # 0.6 (RB-17)
    CF: 0.15                    # 0.1 (VC-3)
    LAP: 0.00                   # 1.3 (LA-2)
    FIDX: 3.30                  # 2.2 (LA-3 option permutation)
    # Cloudflare Jev panel (experiments/jev_panel/run_jev_panel.py; decisions 2026-09-29 D-13). Billed to the user's
    # Cloudflare account, outside the $250: booked in backends.jev-cf.ledger_path, not in this ledger. 0 = not
    # authorized; the user sets the amount (see `run_jev_panel.py preflight` for the projection)
    JEV-CF: 9.50                # user-authorized $15 (2026-10-07), lowered to stay under the $10 AI Gateway credit balance (2026-10-09)
